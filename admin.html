<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ארי משלוחים – ניהול הזמנות</title>
<meta name="theme-color" content="#ff7a00">
<style>
  :root{--brand:#ff7a00;--brand-soft:#fff4e8;--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--ok:#16a34a;--blue:#2563eb;--err:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2}
  header h1{margin:0;font-size:19px}
  header button{background:#ffffff26;color:#fff;border:1px solid #ffffff80;border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;font:inherit;font-size:15px;font-weight:600;padding:10px;border-radius:12px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff}
  .note{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 12px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .cust{font-weight:700;font-size:16px}
  .meta{color:var(--muted);font-size:13px}
  .badge{flex:none;font-size:13px;font-weight:700;border-radius:14px;padding:4px 10px;white-space:nowrap}
  .badge.new{background:#f3f4f6;color:#4b5563}.badge.picked{background:#dbeafe;color:#1d4ed8}.badge.done{background:#dcfce7;color:#15803d}.badge.no{background:#fee2e2;color:#b91c1c}
  .avail{border:2px solid #16a34a}
  .avail.off{border-color:#dc2626;background:#fef2f2}
  .availRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .availTitle{font-weight:800;font-size:17px}
  #availToggle{flex:none;font:inherit;font-size:15px;font-weight:700;padding:10px 14px;border-radius:12px;border:0;color:#fff;cursor:pointer;background:#dc2626}
  .avail.off #availToggle{background:#16a34a}
  #availMsgBox{display:flex;gap:8px;margin-top:10px}
  #availMsg{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
  #availMsgSave{flex:none;font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
  .row{margin-top:8px;line-height:1.55}
  .row a{color:var(--blue);text-decoration:none;font-weight:600}
  .lbl{font-weight:700}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts button{flex:1;font:inherit;font-size:16px;font-weight:700;padding:12px 6px;border-radius:12px;border:0;color:#fff;cursor:pointer}
  .acts .picked{background:var(--blue)}.acts .done{background:var(--ok)}.acts .no{background:#fff;color:#b91c1c;border:1.5px solid #fca5a5}
  .acts .undo{flex:0 0 auto;background:#fff;color:var(--muted);border:1.5px solid var(--line);font-weight:500}
  .acts button:disabled{opacity:.5}
  .login{max-width:360px;margin:40px auto}
  .login input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
  .login button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
  .err{color:var(--err);font-size:14px;min-height:20px}
  .addBtn{width:100%;font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:12px;border:2px dashed var(--brand);background:var(--brand-soft);color:var(--brand);cursor:pointer;margin-bottom:12px}
  #addBox textarea{width:100%;min-height:150px;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:10px}
  .grid label{min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
  .grid .wide{grid-column:1/-1}
  .grid input,.grid select{display:block;width:100%;font:inherit;font-size:16px;color:var(--text);padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:3px;background:#fff}
  .grid input.bad{border-color:var(--err)}
  button.secondary{width:100%;font:inherit;font-size:16px;font-weight:600;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--text);cursor:pointer;margin-top:8px}
  .saveBtn{width:100%;font:inherit;font-size:17px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--ok);color:#fff;cursor:pointer;margin-top:6px}
  .saveBtn:disabled{opacity:.6}
  #parseMsg{color:var(--ok)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .filters select{flex:1 1 40%}
  .filters select{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
  .summary{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:none}
  .summary b{color:var(--brand)}
  .summary .money{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-weight:700}
  .paidY{color:#15803d}.paidN{color:#c2410c}
  .payRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;background:#fff7ed;color:#c2410c;font-weight:700;font-size:14px}
  .payRow.yes{background:#f0fdf4;color:#15803d}
  .payRow button{font:inherit;font-size:14px;font-weight:600;padding:7px 10px;border-radius:9px;border:1.5px solid currentColor;background:#fff;color:inherit;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>🛵 ניהול הזמנות</h1>
  <button type="button" id="refresh">🔄 רענון</button>
</header>
<main>
  <section class="card login" id="loginBox" style="display:none">
    <h2 style="margin-top:0">כניסה</h2>
    <p class="meta">הסיסמה שהגדרת ב-ADMIN_PASSWORD בקוד של גוגל. מקלידים פעם אחת – המכשיר יזכור.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="סיסמה">
    <div class="err" id="loginErr"></div>
    <button type="button" id="loginBtn">כניסה</button>
  </section>

  <div id="app" style="display:none">
    <section class="card avail" id="availBox">
      <div class="availRow">
        <div><div class="availTitle" id="availTitle"></div><div class="meta" id="availSub"></div></div>
        <button type="button" id="availToggle"></button>
      </div>
      <div id="availMsgBox" style="display:none">
        <input id="availMsg" maxlength="120" placeholder="הודעה ללקוחות (לא חובה), למשל: חוזר ב-16:00">
        <button type="button" id="availMsgSave">שמירת ההודעה</button>
      </div>
    </section>
    <div class="tabs">
      <button type="button" id="tabOpen" class="on">פתוחות</button>
      <button type="button" id="tabDone">נסגרו (90 יום)</button>
    </div>
    <div class="filters">
      <select id="custFilter" aria-label="סינון לפי לקוח"><option value="">כל הלקוחות</option></select>
      <select id="paidFilter" aria-label="תשלום">
        <option value="">כל התשלומים</option><option value="no">לא שולם</option><option value="yes">שולם</option>
      </select>
      <select id="rangeFilter" aria-label="טווח זמן">
        <option value="90">90 יום</option><option value="month">החודש</option><option value="lastMonth">חודש שעבר</option>
        <option value="30">30 יום</option><option value="7">7 ימים</option><option value="1">היום</option>
      </select>
    </div>
    <div class="summary" id="summary"></div>
    <div class="note" id="note"></div>
    <button type="button" class="addBtn" id="addOpen">➕ הוספת הזמנה ידנית</button>
    <div id="list"></div>
  </div>

  <section class="card" id="addBox" style="display:none">
    <h2 style="margin-top:0">➕ הוספת הזמנה ידנית</h2>
    <p class="meta">מדביקים את הודעת ההזמנה מווצאפ כמו שהיא – הפרטים יתמלאו לבד. אפשר גם למלא ידנית.</p>
    <textarea id="paste" placeholder="הדבק כאן את הודעת הווצאפ…"></textarea>
    <button type="button" class="secondary" id="parseBtn">📋 מלא פרטים מההודעה</button>
    <div class="err" id="parseMsg"></div>
    <div class="grid">
      <label>מס' הזמנה<input id="f_no" placeholder="למשל 1111-134735"></label>
      <label class="wide">תאריך ושעה<input id="f_time" type="datetime-local"></label>
      <label>לקוח<input id="f_customer"></label>
      <label>מקבל<input id="f_recipient"></label>
      <label class="wide">כתובת מסירה<input id="f_address"></label>
      <label>טלפון מקבל<input id="f_phone" inputmode="tel"></label>
      <label>מה<input id="f_item"></label>
      <label>מתי<input id="f_when"></label>
      <label>מחיר<input id="f_price" inputmode="numeric" placeholder="25"></label>
      <label>תשלום<input id="f_pay"></label>
      <label>סטטוס<select id="f_status"><option>חדשה</option><option>נאסף</option><option>נמסר</option><option>לא פנוי</option></select></label>
      <label class="wide">כתובת איסוף<input id="f_pickup"></label>
      <label>טלפון איסוף<input id="f_pickupPhone" inputmode="tel"></label>
      <label class="wide">הערות<input id="f_notes"></label>
    </div>
    <div class="err" id="addErr"></div>
    <button type="button" class="saveBtn" id="addSave">💾 שמירה בטבלה</button>
    <button type="button" class="secondary" id="addCancel">ביטול</button>
  </section>
</main>

<script>
// אותה כתובת כמו CONFIG.sheetUrl ב-index.html
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyeVkFBCgZJMi6gE5yBoK-ydIinjDWaGL2zSAlOhnRfsai7hz45T8abdZ7cyP23ckowTQ/exec";
const KEY_STORE = "ariDelivery.adminKey";
const BADGES = { "חדשה": ["🕓 חדשה", "new"], "נאסף": ["🛵 נאסף", "picked"], "נמסר": ["✅ נמסר", "done"], "לא פנוי": ["❌ לא פנוי", "no"] };
const CLOSED = ["נמסר", "לא פנוי"];
let avail = { available: true, message: "" };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const waze = a => "https://waze.com/ul?q=" + encodeURIComponent(a) + "&navigate=yes";
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } };
const setKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {} };

let orders = [], tab = "open", key = getKey();

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.flat().forEach(k => k != null && e.append(k));
  return e;
}
function link(text, href) { return el("a", { href, textContent: text, target: href.startsWith("http") ? "_blank" : "" }); }

function showLogin(msg) {
  $("app").style.display = "none"; $("loginBox").style.display = "block";
  $("loginErr").textContent = msg || "";
}

function load() {
  if (!key) return showLogin();
  $("note").textContent = "טוען…";
  fetch(SHEET_URL + "?action=list&key=" + encodeURIComponent(key))
    .then(r => r.json())
    .then(d => {
      if (!d.ok) { setKey(""); key = ""; return showLogin(d.error || "שגיאה"); }
      orders = d.orders || [];
      fillCustomers();
      if (typeof d.available === "boolean") avail = { available: d.available, message: d.message || "" };
      renderAvail();
      $("loginBox").style.display = "none"; $("app").style.display = "block";
      const n = new Date();
      $("note").textContent = `עודכן ב-${pad(n.getHours())}:${pad(n.getMinutes())} · מתעדכן לבד כל דקה`;
      render();
    })
    .catch(() => { $("note").textContent = "אין חיבור לטבלה כרגע – נסה רענון בעוד רגע"; });
}

function orderTime(o) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(o.date || ""), t = /^(\d{1,2}):(\d{2})/.exec(o.time || "") || [0, 0, 0];
  return m ? new Date(+m[3], m[2] - 1, +m[1], +t[1], +t[2]) : null;
}
function inRange(o) {
  const r = $("rangeFilter").value, d = orderTime(o);
  if (!d) return true;
  const now = new Date();
  if (r === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  if (r === "lastMonth") { const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1); return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear(); }
  if (r === "1") return d.toDateString() === now.toDateString();
  return now - d <= +r * 24 * 3600 * 1000;
}
function fillCustomers() {
  const sel = $("custFilter"), cur = sel.value;
  const names = [...new Set(orders.map(o => o.customer).filter(Boolean))].sort((a, b) => a.localeCompare(b, "he"));
  sel.replaceChildren(el("option", { value: "", textContent: "כל הלקוחות" }), ...names.map(n => el("option", { value: n, textContent: n })));
  sel.value = names.indexOf(cur) !== -1 ? cur : "";
}

function render() {
  const closed = o => CLOSED.indexOf(o.status) !== -1;
  const cust = $("custFilter").value;
  const mine = orders.filter(o => !cust || o.customer === cust);
  $("tabOpen").textContent = `פתוחות (${mine.filter(o => !closed(o)).length})`;
  // טווח הזמן חל על הזמנות שנסגרו; פתוחות מוצגות תמיד
  $("rangeFilter").style.display = tab === "done" ? "" : "none";
  const pf = $("paidFilter").value;
  const shown = mine.filter(o => tab === "open" ? !closed(o) : closed(o) && inRange(o))
    .filter(o => !pf || (pf === "yes") === !!o.paid);

  // סיכום: כמה משלוחים נמסרו ובכמה כסף (בלי "לא פנוי")
  const delivered = shown.filter(o => o.status === "נמסר");
  const total = delivered.reduce((t, o) => t + (isNaN(o.price) || o.price === "" ? 0 : Number(o.price)), 0);
  const notAvail = shown.filter(o => o.status === "לא פנוי").length;
  const sum = $("summary");
  sum.style.display = tab === "done" && shown.length ? "block" : "none";
  const amount = a => a.reduce((t, o) => t + (isNaN(o.price) || o.price === "" ? 0 : Number(o.price)), 0);
  const unpaid = delivered.filter(o => !o.paid);
  sum.replaceChildren(el("b", { textContent: `${delivered.length} משלוחים נמסרו · ₪${total}` }),
    `${cust ? " · " + cust : ""}${notAvail ? ` · ${notAvail} לא פנוי` : ""}`,
    el("div", { className: "money" },
      el("span", { className: "paidY", textContent: `💰 שולם: ₪${total - amount(unpaid)}` }),
      el("span", { className: "paidN", textContent: `💸 לא שולם: ₪${amount(unpaid)} (${unpaid.length})` })));

  if (!shown.length) {
    $("list").replaceChildren(el("div", { className: "empty", textContent: tab === "open" ? "אין הזמנות פתוחות 🎉" : "אין הזמנות שנסגרו בטווח הזה" }));
    return;
  }
  $("list").replaceChildren(...shown.map(card));
}

function card(o) {
  const [bt, bc] = BADGES[o.status] || BADGES["חדשה"];
  const acts = el("div", { className: "acts" });
  if (CLOSED.indexOf(o.status) === -1) {
    if (o.status !== "נאסף") acts.append(el("button", { type: "button", className: "picked", textContent: "🛵 נאסף", onclick: e => update(o, "נאסף", e.target) }));
    acts.append(el("button", { type: "button", className: "done", textContent: "✅ נמסר", onclick: e => update(o, "נמסר", e.target) }));
    if (o.status === "חדשה") acts.append(el("button", { type: "button", className: "no", textContent: "❌ לא פנוי",
      onclick: e => { if (confirm(`לסמן שאתה לא פנוי להזמנה של ${o.recipient}? הלקוח יראה שצריך משלוח אחר.`)) update(o, "לא פנוי", e.target); } }));
  }
  if (o.status !== "חדשה") acts.append(el("button", { type: "button", className: "undo", textContent: "↩️ בטל", title: "החזר לשלב הקודם",
    onclick: e => update(o, o.status === "נמסר" ? "נאסף" : "חדשה", e.target) }));
  const payRow = o.status === "לא פנוי" ? null : el("div", { className: "payRow" + (o.paid ? " yes" : "") },
    el("span", { textContent: o.paid ? "💰 שולם" : "💸 לא שולם" }),
    el("button", { type: "button", textContent: o.paid ? "↩️ סמן לא שולם" : "💰 סמן שולם", onclick: e => setPaid(o, !o.paid, e.target) }));

  return el("section", { className: "card" },
    el("div", { className: "top" },
      el("div", {}, el("div", { className: "cust", textContent: o.customer || "לקוח" }),
        el("div", { className: "meta", textContent: `#${o.no} · ${o.date} ${o.time}` })),
      el("span", { className: "badge " + bc, textContent: bt })),
    el("div", { className: "row" },
      el("span", { className: "lbl", textContent: "📦 איסוף: " }), o.pickup, " ",
      o.pickup ? link("ווייז", waze(o.pickup)) : null,
      o.pickupPhone ? [" · ", link("📞 " + o.pickupPhone, "tel:" + o.pickupPhone)] : null),
    el("div", { className: "row" },
      el("span", { className: "lbl", textContent: "📍 מסירה: " }), `${o.recipient} – ${o.address} `,
      link("ווייז", waze(o.address.replace(/ – [^,]*$/, ""))),
      o.phone ? [" · ", link("📞 " + o.phone, "tel:" + o.phone)] : null),
    el("div", { className: "row meta", textContent: [o.item, o.when, o.pay, o.price && (isNaN(o.price) ? o.price : "₪" + o.price)].filter(Boolean).join(" · ") }),
    o.notes ? el("div", { className: "row", textContent: "📝 " + o.notes }) : null,
    payRow,
    acts);
}

function setPaid(o, paid, btn) {
  btn.disabled = true;
  fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "setPaid", key, no: o.no, paid }) })
    .then(() => { o.paid = paid; render(); setTimeout(load, 1500); })
    .catch(() => { btn.disabled = false; alert("העדכון לא נשלח – בדוק חיבור ונסה שוב"); });
}

function update(o, status, btn) {
  btn.disabled = true;
  fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "setStatus", key, no: o.no, status }) })
    .then(() => { o.status = status; render(); setTimeout(load, 1500); })
    .catch(() => { btn.disabled = false; alert("העדכון לא נשלח – בדוק חיבור ונסה שוב"); });
}

$("loginBtn").onclick = () => { key = $("pw").value.trim(); if (!key) return; setKey(key); load(); };
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("refresh").onclick = load;

/* ---------- זמינות כללית ---------- */
function renderAvail() {
  const on = avail.available;
  $("availBox").classList.toggle("off", !on);
  $("availTitle").textContent = on ? "🟢 פנוי למשלוחים" : "🔴 לא פנוי למשלוחים";
  $("availSub").textContent = on ? "הלקוחות מזמינים כרגיל"
    : "הלקוחות רואים הודעה שאתה לא פנוי" + (avail.message ? ` · "${avail.message}"` : "");
  $("availToggle").textContent = on ? "סמן לא פנוי" : "סמן פנוי";
  $("availMsgBox").style.display = on ? "none" : "flex";
  if (document.activeElement !== $("availMsg")) $("availMsg").value = avail.message || "";
}
function saveAvail(available, message) {
  $("availToggle").disabled = true;
  fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "setAvailability", key, available, message }) })
    .then(() => { avail = { available, message }; renderAvail(); setTimeout(load, 1500); })
    .catch(() => alert("העדכון לא נשלח – בדוק חיבור ונסה שוב"))
    .finally(() => { $("availToggle").disabled = false; });
}
$("availToggle").onclick = () => saveAvail(!avail.available, avail.available ? $("availMsg").value.trim() : "");
$("availMsgSave").onclick = () => saveAvail(false, $("availMsg").value.trim());

/* ---------- הוספת הזמנה ידנית ---------- */
const F = ["no", "time", "customer", "recipient", "address", "phone", "item", "when", "price", "pay", "pickup", "pickupPhone", "notes"];
const f = k => $("f_" + k);
function toLocalInput(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function openAdd() {
  F.forEach(k => f(k).value = ""); f("status").value = "חדשה"; f("time").value = toLocalInput(new Date());
  $("paste").value = ""; $("parseMsg").textContent = ""; $("addErr").textContent = "";
  $("app").style.display = "none"; $("addBox").style.display = "block"; window.scrollTo(0, 0);
}
function closeAdd() { $("addBox").style.display = "none"; $("app").style.display = "block"; window.scrollTo(0, 0); }

// מפענח את הודעת ההזמנה שהאתר שולח לווצאפ (גם אם הועתקה עם [תאריך] שם: בהתחלה)
function parseOrder(raw) {
  const lines = raw.replace(/\r/g, "").split("\n")
    .map(l => l.replace(/^\[[^\]]*\]\s*[^:]*:\s*/, "").replace(/\*/g, "").trim());
  const after = (re) => { const l = lines.find(x => re.test(x)); return l ? l.replace(re, "").trim() : ""; };
  const o = {};
  o.no = after(/^🔢\s*מס'?\s*הזמנה:?/);
  o.customer = after(/^(⭐|🤝)\s*לקוח( הסכם)?:/);
  const dt = after(/^📅/).match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (dt) {
    const now = new Date(); let y = now.getFullYear();
    if (+dt[2] > now.getMonth() + 1) y--;                                   // הודעה מדצמבר שנקראת בינואר
    o.time = new Date(y, dt[2] - 1, dt[1], dt[3], dt[4]);
  }
  const block = (re) => {                                                      // השורה של הכותרת + 3 השורות שאחריה
    const i = lines.findIndex(x => re.test(x));
    if (i === -1) return null;
    return { name: lines[i].replace(re, "").trim(), addr: lines[i + 1] || "", phone: (lines[i + 2] || "").replace(/^📞\s*/, "") };
  };
  const pick = block(/^📦\s*איסוף:/), drop = block(/^📍\s*מסירה:/);
  if (pick) { o.pickup = pick.addr; o.pickupPhone = pick.phone; if (!o.customer) o.customer = pick.name; }
  if (drop) { o.recipient = drop.name; o.address = drop.addr; o.phone = drop.phone; }
  const iw = after(/^📏/).split("|");
  if (iw[0]) o.item = iw[0].trim();
  if (iw[1]) o.when = iw[1].replace(/^\s*⏱\s*/, "").trim();
  o.pay = after(/^💰/);
  const pr = after(/^💵\s*מחיר:/);
  o.price = (pr.match(/(\d+)/) || [])[1] || pr;
  o.notes = after(/^📝/);
  return o;
}

$("parseBtn").onclick = () => {
  const o = parseOrder($("paste").value);
  let n = 0;
  F.forEach(k => {
    if (o[k] === undefined || o[k] === "") return;
    f(k).value = k === "time" ? toLocalInput(o[k]) : o[k]; n++;
  });
  $("parseMsg").style.color = n ? "var(--ok)" : "var(--err)";
  $("parseMsg").textContent = n ? `✅ מולאו ${n} שדות – בדוק שהכול נכון ושמור` : "לא זוהו פרטים בהודעה – אפשר למלא ידנית";
};

$("addSave").onclick = () => {
  const need = ["recipient", "address"];
  need.forEach(k => f(k).classList.toggle("bad", !f(k).value.trim()));
  if (need.some(k => !f(k).value.trim())) { $("addErr").textContent = "חובה למלא לפחות מקבל וכתובת מסירה"; return; }
  const t = f("time").value ? new Date(f("time").value) : new Date();
  const no = f("no").value.trim() || `ידני-${pad(t.getDate())}${pad(t.getMonth() + 1)}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(new Date().getSeconds())}`;
  const v = k => f(k).value.trim();
  const price = /^\d+$/.test(v("price")) ? Number(v("price")) : v("price");
  const status = f("status").value;
  const rec = {
    no, time: t.toISOString(), customer: v("customer") || "הזמנה ידנית", recipient: v("recipient"), dest: v("address").split(",").pop().trim(),
    address: v("address"), recipientPhone: v("phone"), item: v("item"), when: v("when"), pay: v("pay"), price,
    notes: v("notes"), pickup: v("pickup"), pickupPhone: v("pickupPhone"), resync: true,
    message: $("paste").value.trim() || [`הזמנה ידנית #${no}`, `לקוח: ${v("customer")}`, `מסירה: ${v("recipient")} – ${v("address")} ${v("phone")}`,
      `${v("item")} ${v("when")}`, `מחיר: ${v("price")}`, v("notes")].filter(Boolean).join("\n"),
  };
  const btn = $("addSave"); btn.disabled = true; btn.textContent = "שומר…"; $("addErr").textContent = "";
  const post = body => fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(body) });
  post(rec)
    .then(() => status !== "חדשה" ? new Promise(r => setTimeout(r, 1500)).then(() => post({ action: "setStatus", key, no, status })) : null)
    .then(() => {
      closeAdd(); $("note").textContent = `✅ הזמנה #${no} נשמרה – מרענן…`;
      setTimeout(load, 1500);
    })
    .catch(() => { $("addErr").textContent = "השמירה נכשלה – בדוק חיבור לאינטרנט ונסה שוב"; })
    .finally(() => { btn.disabled = false; btn.textContent = "💾 שמירה בטבלה"; });
};
$("addOpen").onclick = openAdd;
$("addCancel").onclick = closeAdd;
$("custFilter").onchange = render;
$("rangeFilter").onchange = render;
$("paidFilter").onchange = render;
$("tabOpen").onclick = () => { tab = "open"; $("tabOpen").classList.add("on"); $("tabDone").classList.remove("on"); render(); };
$("tabDone").onclick = () => { tab = "done"; $("tabDone").classList.add("on"); $("tabOpen").classList.remove("on"); render(); };
setInterval(() => { if (key && !document.hidden) load(); }, 60000);
load();
</script>
